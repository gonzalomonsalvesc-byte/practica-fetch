<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Prueba fetch</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; background: #eaeaea; }
    li { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>Usuarios</h1>
  <ul id="lista"></ul>

  <script>
    const lista = document.querySelector("#lista");
    const URL = "https://jsonplaceholder.typicode.com/users";

    fetch(URL)
      .then((r) => r.json())
      .then((datos) => {
        datos.forEach((u) => {
          lista.innerHTML += `<li>${u.name} — ${u.email}</li>`;
        });
      })
      .catch((e) => console.error(e));
  </script>
</body>
</html>
